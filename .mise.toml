[settings]
# Keep the selected runtimes first even in an already-activated shell.
activate_aggressive = true

[tools]
node = "24.21.0"
pnpm = "10.34.6"

[tasks.install]
description = "Install frontend packages from their independent lockfiles"
run = [
  "pnpm --dir rhwp-studio install --frozen-lockfile",
  "pnpm --dir rhwp-chrome install --frozen-lockfile",
  "pnpm --dir rhwp-firefox install --frozen-lockfile",
  "pnpm --dir rhwp-vscode install --frozen-lockfile",
  "pnpm --dir scripts/frontend-metrics install --frozen-lockfile",
]

[tasks.studio-dev]
description = "Start the Studio Vite development server"
run = "pnpm --dir rhwp-studio run dev"
